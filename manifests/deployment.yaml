apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesync-app
  namespace: default
  labels:
    app.kubernetes.io/name: kubesync-app
    app.kubernetes.io/part-of: kubesync-gitops
spec:
  replicas: 4
  selector:
    matchLabels:
      app: kubesync-app
  template:
    metadata:
      labels:
        app: kubesync-app
    spec:
      containers:
      - name: web-server
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"