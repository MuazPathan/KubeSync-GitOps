apiVersion: v1
kind: Service
metadata:
  name: kubesync-service
  namespace: default
  labels:
    app.kubernetes.io/name: kubesync-app
    app.kubernetes.io/part-of: kubesync-gitops
spec:
  type: NodePort
  selector:
    app: kubesync-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP